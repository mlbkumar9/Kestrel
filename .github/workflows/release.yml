name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Fails the run before any build starts if the tag has no CHANGELOG.md section
  # (heading "## [<tag without v>]", e.g. "## [4.0.0] - 2026-11-20") or does not match
  # the kestrel-gpui crate version.
  notes:
    name: Check release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extract release notes for tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/release-notes.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

  # Primary Windows build: the GPUI app, built natively (GPUI release shaders need fxc.exe).
  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: notes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build
        run: cargo build --release -p kestrel-gpui
      - name: Package bundled tools
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 `
            -BinaryPath "target/release/kestrel-gpui.exe" `
            -Tag "$env:RELEASE_TAG" `
            -OutputDirectory "dist"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  # Secondary asset: the egui app, kept until it is removed.
  windows-legacy:
    name: Windows x64 legacy egui
    runs-on: windows-latest
    needs: notes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build
        run: cargo build -p kestrel-media --release --target x86_64-pc-windows-msvc
      - name: Package bundled tools
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 `
            -BinaryPath "target/x86_64-pc-windows-msvc/release/kestrel.exe" `
            -Tag "$env:RELEASE_TAG" `
            -OutputDirectory "dist" `
            -ExeName "kestrel.exe" `
            -ArchiveName "Kestrel-$($env:RELEASE_TAG)-legacy-egui-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-legacy-release
          path: dist/*
          if-no-files-found: error

  windows-msi:
    name: Windows MSI installer
    runs-on: ubuntu-latest
    needs:
      - windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Install MSI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl
      - name: Build MSI and standalone executable
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          archive="dist/Kestrel-${RELEASE_TAG}-windows-x64.zip"
          stage="windows-stage"
          mkdir -p "$stage"
          unzip -q "$archive" -d "$stage"
          ./scripts/build-msi.sh "$stage" "$version" \
            "dist/Kestrel-${RELEASE_TAG}-windows-x64.msi"
          cp "$stage/Kestrel.exe" \
            "dist/Kestrel-${RELEASE_TAG}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            dist/Kestrel-*-windows-x64.msi
            dist/Kestrel-*-windows-x64.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    needs: notes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build
        run: cargo build --release -p kestrel-gpui
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" macos aarch64 \
            "target/release/kestrel-gpui" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/*
          if-no-files-found: error

  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    needs: notes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build
        run: cargo build --release -p kestrel-gpui
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" macos x86_64 \
            "target/release/kestrel-gpui" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: notes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build
        run: cargo build --release -p kestrel-gpui
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" linux x64 \
            "target/release/kestrel-gpui" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - notes
      - windows
      - windows-legacy
      - windows-msi
      - macos-arm64
      - macos-x64
      - linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check release assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            "Kestrel-${RELEASE_TAG}-windows-x64.zip"
            "Kestrel-${RELEASE_TAG}-windows-x64.msi"
            "Kestrel-${RELEASE_TAG}-windows-x64.exe"
            "Kestrel-${RELEASE_TAG}-legacy-egui-windows-x64.zip"
            "Kestrel-${RELEASE_TAG}-macos-aarch64.zip"
            "Kestrel-${RELEASE_TAG}-macos-x86_64.zip"
            "Kestrel-${RELEASE_TAG}-linux-x64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "dist/$asset" ]]; then
              echo "::error::Release asset is missing or empty: $asset" >&2
              exit 1
            fi
          done
          ls -l dist
      - name: Create checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Extract release notes for tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/release-notes.sh "$RELEASE_TAG" release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
