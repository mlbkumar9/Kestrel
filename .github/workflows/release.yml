name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package bundled tools
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 `
            -BinaryPath "LangMux_Native/target/x86_64-pc-windows-msvc/release/kestrel.exe" `
            -Tag "$env:RELEASE_TAG" `
            -OutputDirectory "dist"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  windows-msi:
    name: Windows MSI installer
    runs-on: ubuntu-latest
    needs:
      - windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Install MSI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl
      - name: Build MSI and standalone executable
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dist/Kestrel-${RELEASE_TAG}-windows-x64.zip"
          stage="windows-stage"
          mkdir -p "$stage"
          unzip -q "$archive" -d "$stage"
          ./scripts/build-msi.sh "$stage" "$version" \
            "dist/Kestrel-${RELEASE_TAG}-windows-x64.msi"
          cp "$stage/kestrel.exe" \
            "dist/Kestrel-${RELEASE_TAG}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            dist/Kestrel-*-windows-x64.msi
            dist/Kestrel-*-windows-x64.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" macos aarch64 \
            "LangMux_Native/target/aarch64-apple-darwin/release/kestrel" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/*
          if-no-files-found: error

  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" macos x86_64 \
            "LangMux_Native/target/x86_64-apple-darwin/release/kestrel" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" linux x64 \
            "LangMux_Native/target/x86_64-unknown-linux-gnu/release/kestrel" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows
      - windows-msi
      - macos-arm64
      - macos-x64
      - linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum Kestrel-* > SHA256SUMS.txt
      - name: Extract release notes for tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          escaped_version="$(printf '%s' "$version" | sed 's/\./\\./g')"
          CHANGELOG_VERSION_REGEX="$escaped_version" awk '
            $0 ~ ("^## \\[" ENVIRON["CHANGELOG_VERSION_REGEX"] "\\]") { capture = 1; found = 1; next }
            /^## \[/ && capture { exit }
            capture { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md || {
            echo "::error::No CHANGELOG.md section found for tag ${RELEASE_TAG} (expected version ${version})." >&2
            exit 1
          }
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md section for tag ${RELEASE_TAG} is empty." >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
