[package]
name = "kestrel-media"
version = "3.0.2"
edition = "2024"
rust-version = "1.92"
authors = ["mlbkumar9", "Devin <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1.34"
