name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package bundled tools
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./scripts/package-windows.ps1 `
            -BinaryPath "LangMux_Native/target/x86_64-pc-windows-msvc/release/langmux.exe" `
            -Tag "$env:RELEASE_TAG" `
            -OutputDirectory "dist"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" macos aarch64 \
            "LangMux_Native/target/aarch64-apple-darwin/release/langmux" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/*
          if-no-files-found: error

  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" macos x86_64 \
            "LangMux_Native/target/x86_64-apple-darwin/release/langmux" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Build
        working-directory: LangMux_Native
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh "$RELEASE_TAG" linux x64 \
            "LangMux_Native/target/x86_64-unknown-linux-gnu/release/langmux" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos-arm64
      - macos-x64
      - linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum LangMux-* > SHA256SUMS.txt
      - name: Extract v2.0.0 release notes
        run: |
          awk '
            /^## \[2\.0\.0\]/ { capture = 1; next }
            /^## \[/ && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
