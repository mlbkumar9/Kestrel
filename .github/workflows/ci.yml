name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LangMux_Native -> target
      - name: Check formatting
        working-directory: LangMux_Native
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: LangMux_Native
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        working-directory: LangMux_Native
        run: cargo test
