name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  gpui-windows:
    name: GPUI Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # GPUI release shaders require fxc.exe on a Windows host.
      - name: Build GPUI
        run: cargo build --release -p kestrel-gpui
      - name: Package portable zip
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 `
            -BinaryPath "target/release/kestrel-gpui.exe" `
            -Tag "ci" `
            -OutputDirectory "dist"
      - name: Check portable zip layout
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/Kestrel-ci-windows-x64.zip").Path)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          } finally {
            $zip.Dispose()
          }
          $entries | Sort-Object
          $required = @(
            "Kestrel.exe", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md",
            "tools/ffmpeg/bin/ffmpeg.exe", "tools/ffmpeg/bin/ffprobe.exe", "tools/ffmpeg/LICENSE",
            "tools/mkvtoolnix/mkvmerge.exe", "tools/mkvtoolnix/COPYING.txt"
          )
          $missing = $required | Where-Object { $entries -notcontains $_ }
          if ($missing) { throw "Portable zip is missing: $($missing -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-windows-release
          path: target/release/kestrel-gpui.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-windows-package
          path: dist/Kestrel-ci-windows-x64.zip
          if-no-files-found: error

  gpui-unix:
    name: GPUI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos
            arch: aarch64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: gpui-release
      - name: Build GPUI
        run: cargo build --release -p kestrel-gpui
      - name: Test GPUI
        run: cargo test --release -p kestrel-gpui
      - name: Package
        run: |
          mkdir -p dist
          ./scripts/package-unix.sh ci ${{ matrix.platform }} ${{ matrix.arch }} \
            target/release/kestrel-gpui dist
      - name: Check package layout
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            listing="$(tar -tzf dist/Kestrel-ci-linux-x64.tar.gz)"
            required=(./kestrel ./README.md ./LICENSE ./THIRD_PARTY_NOTICES.md
              ./share/applications/kestrel.desktop
              ./share/icons/hicolor/256x256/apps/kestrel.png)
          else
            listing="$(unzip -Z1 dist/Kestrel-ci-macos-${{ matrix.arch }}.zip)"
            required=(Kestrel.app/Contents/MacOS/Kestrel
              Kestrel.app/Contents/Info.plist
              Kestrel.app/Contents/Resources/Kestrel.icns
              README.md LICENSE THIRD_PARTY_NOTICES.md)
          fi
          printf '%s\n' "$listing"
          for entry in "${required[@]}"; do
            grep -qxF "$entry" <<<"$listing" || { echo "Package is missing $entry" >&2; exit 1; }
          done

  msi:
    name: Windows MSI packaging
    runs-on: ubuntu-latest
    needs: gpui-windows
    steps:
      - uses: actions/checkout@v4
      - name: Install MSI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl
      - name: Test MSI packaging
        run: scripts/test-msi.sh
      # Real MSI from the CI-built exe and bundled tools, for the upgrade test below.
      - uses: actions/download-artifact@v4
        with:
          name: gpui-windows-package
          path: package
      - name: Build MSI from the CI package
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' crates/kestrel-gpui/Cargo.toml | cut -d'"' -f2)"
          mkdir -p stage dist
          unzip -q package/Kestrel-ci-windows-x64.zip -d stage
          ./scripts/build-msi.sh stage "$version" "dist/Kestrel-ci-windows-x64.msi"
          echo "$version" > dist/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-windows-msi
          path: |
            dist/Kestrel-ci-windows-x64.msi
            dist/version.txt
          if-no-files-found: error

  msi-upgrade:
    name: Windows MSI upgrade from 4.0.0
    runs-on: windows-latest
    needs: msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-windows-msi
          path: new
      - name: Download the published 4.0.0 MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.0.0 -R ${{ github.repository }} -p "Kestrel-v4.0.0-windows-x64.msi" --dir old
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
      - name: Upgrade from 4.0.0
        shell: pwsh
        run: |
          $version = (Get-Content new/version.txt -Raw).Trim()
          ./scripts/test-msi-upgrade.ps1 `
            -OldMsi "old/Kestrel-v4.0.0-windows-x64.msi" `
            -NewMsi "new/Kestrel-ci-windows-x64.msi" `
            -ExpectedVersion $version `
            -LogDirectory "msi-upgrade-logs"
      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-upgrade-logs
          path: msi-upgrade-logs
          if-no-files-found: warn
